<!DOCTYPE html>
<html>
<head>
    <title>EVE Activity</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>EVE Activity</h1>

<canvas id="chart"></canvas>

<script>

fetch("systems/Nahol.json")
.then(r => r.json())
.then(data => {

    const history = data.history;

    new Chart(
        document.getElementById("chart"),
        {
            type: "line",
            data: {
                labels: history.map(x => x.date),
                datasets: [{
                    label: "Jumps",
                    data: history.map(x => x.jumps)
                }]
            }
        }
    );
});

</script>

</body>
</html>
