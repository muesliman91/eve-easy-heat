<!DOCTYPE html>
<html>
<body>

<h1>EVE System Information</h1>

<table border="1">
    <tbody id="systemTable"></tbody>
</table>

<script>

fetch("systems/Nahol.json")
  .then(r => r.json())
  .then(data => {

    document.getElementById("systemTable").innerHTML = `
      <tr>
        <th>System</th>
        <td>${data.name}</td>
      </tr>

      <tr>
        <th>System ID</th>
        <td>${data.system_id}</td>
      </tr>

      <tr>
        <th>Security</th>
        <td>${data.security}</td>
      </tr>

      <tr>
        <th>Region</th>
        <td>${data.region}</td>
      </tr>

      <tr>
        <th>Current Jumps</th>
        <td>${data.current.jumps}</td>
      </tr>

      <tr>
        <th>Current NPC Kills</th>
        <td>${data.current.npc_kills}</td>
      </tr>

      <tr>
        <th>Current Ship Kills</th>
        <td>${data.current.ship_kills}</td>
      </tr>

      <tr>
        <th>Current Pod Kills</th>
        <td>${data.current.pod_kills}</td>
      </tr>

      <tr>
        <th>24h Jumps</th>
        <td>${data.totals_24h.jumps}</td>
      </tr>

      <tr>
        <th>24h NPC Kills</th>
        <td>${data.totals_24h.npc_kills}</td>
      </tr>

      <tr>
        <th>24h Ship Kills</th>
        <td>${data.totals_24h.ship_kills}</td>
      </tr>

      <tr>
        <th>24h Pod Kills</th>
        <td>${data.totals_24h.pod_kills}</td>
      </tr>

      <tr>
        <th>7d Jumps</th>
        <td>${data.totals_7d.jumps}</td>
      </tr>

      <tr>
        <th>7d NPC Kills</th>
        <td>${data.totals_7d.npc_kills}</td>
      </tr>

      <tr>
        <th>7d Ship Kills</th>
        <td>${data.totals_7d.ship_kills}</td>
      </tr>

      <tr>
        <th>7d Pod Kills</th>
        <td>${data.totals_7d.pod_kills}</td>
      </tr>

      <tr>
        <th>Snapshots Collected</th>
        <td>${data.snapshot_count}</td>
      </tr>
    `;
  });

</script>

</body>
</html>
