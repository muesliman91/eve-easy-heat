<!DOCTYPE html>
<html>
<head>
    <title>EVE Activity</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>EVE Activity</h1>

<canvas id="chart"></canvas>

<script>

fetch("activity.json")
    .then(response => response.json())
    .then(data => {

        new Chart(
            document.getElementById("chart"),
            {
                type: "line",
                data: {
                    labels: data.map(x => x.date),
                    datasets: [{
                        label: "Ship Jumps",
                        data: data.map(x => x.jumps),
                        borderColor: "blue",
                        fill: false
                    }]
                }
            }
        );

    });

</script>

</body>
</html>
