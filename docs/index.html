<!DOCTYPE html>
<html>

<body>

<h1>EVE System Information</h1>

<table border="1">
    <tbody id="systemTable"></tbody>
</table>

<script>

fetch("systems/Nahol.json")
  .then(r => r.json())
  .then(data => {

    document.getElementById("systemTable").innerHTML = `
      <tr>
        <th>System</th>
        <td>${data.name}</td>
      </tr>

      <tr>
        <th>System ID</th>
        <td>${data.system_id}</td>
      </tr>

      <tr>
        <th>Security</th>
        <td>${data.security}</td>
      </tr>

      <tr>
        <th>Region</th>
        <td>${data.region}</td>
      </tr>

      <tr>
        <th>Jumps</th>
        <td>${data.activity.jumps}</td>
      </tr>

      <tr>
        <th>NPC Kills</th>
        <td>${data.activity.npc_kills}</td>
    </tr>

        <tr>
            <th>Ship Kills</th>
            <td>${data.activity.ship_kills}</td>
        </tr>

        <tr>
            <th>Pod Kills</th>
            <td>${data.activity.pod_kills}</td>
        </tr>
    `;
  });

</script>

</body>
</html>
